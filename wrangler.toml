#:schema node_modules/wrangler/config-schema.json
name = "xget"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages configuration
pages_build_output_dir = "public"

# For backward compatibility with Workers, keep this section
# This allows the project to work as both a Worker and a Page
main = "src/index.js"
workers_dev = false

[placement]
mode = "smart"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
